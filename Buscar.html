<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CienciasBusca</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap" rel="stylesheet">
</head>
<body>


<!-- Header -->
<!-- Para las opciones
- Reportar
- Usuario -->
  <header class="main-header">
        <a href="Inicio.html" class="brand">CienciasBusca</a>
        <nav class="nav-menu">
            <a href="Reportar.html"  class="nav-link">Reportar</a>
            <a href="" class="nav-link">Usuario</a>
        </nav>
    </header>

  <main class="buscar">
    <h1>Buscar</h1>

  <!-- Buscador para que el usuario ingrese el nombre del objeto perdido -->
    <div class="search-bar">
        <span class="search-icon">🔍</span>
        <input type="text" id="busquedaObjeto" name="busqueda" placeholder="Nombre del objeto" />
    </div>

<!-- Presentacion de objetos a través de tarjetas mostrando

Estado - Perdido | Encontrado | Recuperado
Nombre - Nombre del objeto
Descripcion - Detalles de objeto; lugar, color, tamaño, accesorio distintivo.
-->

        <div class="role-cards">
            <div class="card">
                <p><span>✖</span> Perdido</p>
                <div class="placeholder-image"></div>
                <h2>Nombre</h2>
                <p>Descripcion</p>
            </div>
            <div class="card">
                <p><span>❗</span> Encontrado</p>
                <div class="placeholder-image"></div>
                <h2>Nombre</h2>
                <p>Descripcion</p>
            </div>
            <div class="card">
                <p><span>✔</span> Recuperado</p>
                <div class="placeholder-image"></div>
                <h2>Nombre</h2>
                <p>Descripcion</p>
            </div>
        </div>
    </main>


<!-- Footer -->
<!-- Ofrece apartado para contactar por:
- Correo
- Telefono
Ofrece apoyo al usuario con el apartado
- Ayuda -->

<footer class="footer">
    <a href="">Correo</a>
    <a href="">Teléfono</a>
    <a href="">Ayuda</a>
</footer>

</body>
</html>
