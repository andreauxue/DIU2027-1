<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CienciasBusca</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Carga de tipografía NunitoSans para estilo Neumorfismo -->
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap" rel="stylesheet">
</head>
<body>


<!-- Header -->
<!-- Para las opciones
- Buscar
- Reportar
- Usuario -->
  <header class="main-header">
        <a href="Inicio.html" class="brand">CienciasBusca</a>
        <nav class="nav-menu">
            <a href="Buscar.html"  class="nav-link">Buscar</a>
            <a href="" class="nav-link">Usuario</a>

        </nav>
    </header>


<!-- Sección de Reporte -->

<main class="reportar">
    <h1>Reporte</h1>
    <p></p>


<!-- Formulario para realizar el reporte de un objeto perdido

Campos:

- Subir imagen

- Ingresar nombre del objeto

- Describir características del objeto

- Boton para reportar

-->
    <form>

<!--  Campo para subir la imagen    -->

        <label for="imagenObjeto" class="boton-subir">
        <span class="placeholder-image"></span>
        <span>Subir imagen</span>
        </label>
        <input type="file" id="imagenObjeto" name="campoImagen" accept="image/*" hidden><br><br>

<!-- Campo para nombre de objeto -->

        <label for="nombreObjeto">Nombre del objeto</label><br>
        <input type="text" id="nombreObjeto" name="campoNombreObjeto" placeholder="Escribe aquí..."><br><br>

<!-- Campo para describir el objeto a reportar -->

        <label for="descripcionObjeto">Descripción</label><br>
        <input type="text" id="descripcionObjeto" name="campoDescripcion" placeholder="Describe el objeto..."><br><br>

<!--    Botón 'Reportar'      -->
        <input type="submit" value="Publicar">
    </form>
</main>


<!-- Footer -->
<!-- Ofrece apartado para contactar por:
- Correo
- Telefono
Ofrece apoyo al usuario con el apartado
- Ayuda -->

<footer class="footer">
    <a href="">Correo</a>
    <a href="">Teléfono</a>
    <a href="">Ayuda</a>
</footer>
</body>
</html>
